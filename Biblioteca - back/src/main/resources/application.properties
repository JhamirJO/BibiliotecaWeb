spring.config.import=optional:file:./.env[.properties]

spring.r2dbc.url=r2dbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:Biblioteca}
spring.r2dbc.username=${DATABASE_USER:postgres}
spring.r2dbc.password=${DATABASE_PASSWORD}

app.jwt.secret-base64=${JWT_SECRET_BASE64}